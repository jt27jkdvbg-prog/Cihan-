
name: Otomatik Testler

on:
  push:
    branches:
      - main
      - cinematic-pipeline-v2

  pull_request:
    branches:
      - main
      - cinematic-pipeline-v2

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: FFmpeg kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python dosyalarını derleme kontrolü
        run: |
          python -m compileall -q film_project.py generate.py camera_director.py cinematic_director.py dialogue_director.py speech_director.py quality_gate.py

      - name: Ana testleri çalıştır
        run: python -m unittest discover -s tests -v

      - name: Ses yönetmeni testlerini çalıştır
        run: python -m unittest test_speech_director -v
