
name: Video Üret

on:
  workflow_dispatch:
    inputs:
      konu:
        description: "Video konusu / başlığı"
        required: true
        type: string
      sure:
        description: "Hedef süre (saniye)"
        required: false
        default: "45"
        type: string
      gorsel_tarzi:
        description: "Videonun görsel tarzı"
        required: true
        default: "3d"
        type: choice
        options:
          - "3d"
          - "anime"
          - "realistic"
          - "2d"
          - "game"
          - "storybook"
          - "comic"
          - "custom"
      ozel_tarz:
        description: "Özel tarz seçtiysen açıklamasını yaz"
        required: false
        type: string

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: FFmpeg ve yazı tipi kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Python paketlerini kur
        run: pip install -r requirements.txt

      - name: Videoyu üret
        timeout-minutes: 40
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TARGET_SECONDS: ${{ inputs.sure }}
          VIDEO_DILI: "Türkçe"
          VISUAL_STYLE: ${{ inputs.gorsel_tarzi }}
          CUSTOM_VISUAL_STYLE: ${{ inputs.ozel_tarz }}
          KONU: ${{ inputs.konu }}
        run: python generate.py --topic "$KONU"

      - name: Sonucu Release olarak yayınla
        env:
          GH_TOKEN: ${{ github.token }}
          KONU: ${{ inputs.konu }}
        run: |
          TITLE=$(python -c "import json;print(json.load(open('output/metadata.json'))['title'])")
          gh release create "video-${{ github.run_number }}" \
            output/video.mp4 output/metadata.json output/thumbnail.jpg output/script.json \
            --title "$TITLE" --notes "Konu: $KONU"
