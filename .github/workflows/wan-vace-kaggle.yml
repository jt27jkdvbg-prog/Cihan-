
name: Wan Multi-Scene Film Generator

on:
  workflow_dispatch:
    inputs:
      konu:
        description: "Filmin konusu"
        required: true
        type: string
      prompt:
        description: "Ana hikaye ve karakter açıklaması"
        required: true
        type: string
      scenes_json:
        description: "Sahne açıklamalarının JSON listesi"
        required: false
        type: string
      stil:
        description: "Görsel tarz"
        required: true
        default: "cinematic realistic"
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kaggle CLI kur
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade kaggle six

      - name: Kaggle kimlik doğrulama
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "KAGGLE_API_TOKEN eksik."
            exit 1
          fi

          mkdir -p ~/.kaggle
          printf '%s' "$KAGGLE_API_TOKEN" > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token

          kaggle kernels list --mine

      - name: Worker dosyasını hazırla
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          VIDEO_TOPIC: ${{ inputs.konu }}
          VIDEO_PROMPT: ${{ inputs.prompt }}
          VIDEO_SCENES_JSON: ${{ inputs.scenes_json }}
          VIDEO_STYLE: ${{ inputs.stil }}
        run: |
          set -euo pipefail
          mkdir -p kaggle-worker

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          owner = os.environ["KAGGLE_USERNAME"].strip().lower()
          topic = os.environ["VIDEO_TOPIC"].strip()
          prompt = os.environ["VIDEO_PROMPT"].strip()
          style = os.environ["VIDEO_STYLE"].strip()

          if not owner:
              raise ValueError("KAGGLE_USERNAME boş olamaz.")

          if not topic or not prompt or not style:
              raise ValueError("Konu, prompt ve stil zorunludur.")

          raw_scenes = os.environ.get("VIDEO_SCENES_JSON", "").strip()
          scenes = json.loads(raw_scenes) if raw_scenes else [prompt]

          if not isinstance(scenes, list) or not scenes:
              raise ValueError("Sahneler JSON listesi olmalıdır.")

          if len(scenes) > 12:
              raise ValueError("En fazla 12 sahne üretilebilir.")

          if not all(isinstance(s, str) and s.strip() for s in scenes):
              raise ValueError("Her sahne dolu bir metin olmalıdır.")

          request = {
              "topic": topic,
              "prompt": prompt,
              "style": style,
              "scenes": scenes
          }

          metadata = {
              "id": owner + "/cihan-wan-vace-worker",
              "title": "Cihan Multi Scene Film Worker",
              "code_file": "worker.py",
              "language": "python",
              "kernel_type": "script",
              "is_private": True,
              "enable_gpu": True,
              "enable_internet": True,
              "machine_shape": "NvidiaTeslaT4",
              "dataset_sources": [],
              "competition_sources": [],
              "kernel_sources": [],
              "model_sources": []
          }

          Path("kaggle-worker/kernel-metadata.json").write_text(
              json.dumps(metadata, indent=2),
              encoding="utf-8"
          )

          worker = r'''
          import sys
          import json
          import shutil
          import subprocess
          import traceback
          from pathlib import Path

          WORK = Path("/kaggle/working")
          REQUEST_JSON = None

          def run(command, cwd=None, timeout=None):
              print("\\n>>>", " ".join(map(str, command)), flush=True)
              subprocess.run(
                  command,
                  cwd=cwd,
                  check=True,
                  timeout=timeout
              )

          def main():
              request = json.loads(REQUEST_JSON)
              topic = request["topic"]
              style = request["style"]
              scenes = request["scenes"]

              output_dir = WORK / "film_output"
              output_dir.mkdir(parents=True, exist_ok=True)

              print("1. GPU kontrolü", flush=True)

              run([
                  sys.executable, "-c",
                  "import torch; "
                  "assert torch.cuda.is_available(), 'CUDA bulunamadı'; "
                  "print(torch.cuda.get_device_name(0))"
              ])

              print("2. Wan bağımlılıkları kuruluyor", flush=True)

              run([
                  sys.executable, "-m", "pip", "install",
                  "ftfy==6.3.1",
                  "easydict",
                  "einops",
                  "timm",
                  "safetensors",
                  "diffusers>=0.31.0",
                  "transformers>=4.49.0",
                  "tokenizers>=0.20.3",
                  "accelerate>=1.1.1",
                  "tqdm",
                  "numpy>=1.23.5,<2",
                  "imageio",
                  "imageio-ffmpeg",
                  "opencv-python-headless",
                  "huggingface_hub"
              ], timeout=3600)

              print("3. FFmpeg kontrolü", flush=True)

              if not shutil.which("ffmpeg"):
                  run(["apt-get", "update"], timeout=1200)
                  run(["apt-get", "install", "-y", "ffmpeg"], timeout=1200)

              print("4. Wan modeli indiriliyor", flush=True)

              from huggingface_hub import snapshot_download

              model_dir = snapshot_download(
                  repo_id="Wan-AI/Wan2.1-T2V-1.3B"
              )

              print("Model hazır:", model_dir, flush=True)

              print("5. Wan deposu hazırlanıyor", flush=True)

              repo = WORK / "Wan2.1"

              if not repo.exists():
                  run([
                      "git", "clone",
                      "https://github.com/Wan-Video/Wan2.1.git",
                      str(repo)
                  ], timeout=1800)

              print("6. T4 FP16 uyumluluğu ayarlanıyor", flush=True)

              model_file = repo / "wan" / "modules" / "model.py"
              model_source = model_file.read_text(encoding="utf-8")

              old_import = "from .attention import flash_attention"

              if old_import not in model_source:
                  raise RuntimeError("Attention import satırı bulunamadı.")

              model_source = model_source.replace(
                  old_import,
                  "from .attention import attention",
                  1
              )

              if "flash_attention(" not in model_source:
                  raise RuntimeError("Attention çağrıları bulunamadı.")

              model_source = model_source.replace(
                  "flash_attention(",
                  "attention("
              )

              if "flash_attention(" in model_source:
                  raise RuntimeError("Attention dönüşümü tamamlanamadı.")

              model_file.write_text(model_source, encoding="utf-8")

              attention_file = repo / "wan" / "modules" / "attention.py"
              attention_source = attention_file.read_text(encoding="utf-8")

              old_dtype = "dtype=torch.bfloat16,"

              if old_dtype not in attention_source:
                  raise RuntimeError("Attention BF16 ayarı bulunamadı.")

              attention_source = attention_source.replace(
                  old_dtype,
                  "dtype=torch.float16,"
              )

              if old_dtype in attention_source:
                  raise RuntimeError("Tüm BF16 ayarları FP16 yapılamadı.")

              attention_file.write_text(
                  attention_source,
                  encoding="utf-8"
              )

              shared_file = repo / "wan" / "configs" / "shared_config.py"
              shared_source = shared_file.read_text(encoding="utf-8")

              replacements = [
                  (
                      "wan_shared_cfg.t5_dtype = torch.bfloat16",
                      "wan_shared_cfg.t5_dtype = torch.float16"
                  ),
                  (
                      "wan_shared_cfg.param_dtype = torch.bfloat16",
                      "wan_shared_cfg.param_dtype = torch.float16"
                  )
              ]

              for old, new in replacements:
                  if old not in shared_source:
                      raise RuntimeError(
                          "FP16 yapılandırma satırı bulunamadı: " + old
                      )
                  shared_source = shared_source.replace(old, new, 1)

              shared_file.write_text(
                  shared_source,
                  encoding="utf-8"
              )

              print("7. FP16 GPU testi", flush=True)

              run([
                  sys.executable, "-c",
                  "import torch; "
                  "q=torch.randn((1,2,128,64),device='cuda',dtype=torch.float16); "
                  "o=torch.nn.functional.scaled_dot_product_attention(q,q,q); "
                  "torch.cuda.synchronize(); "
                  "print('FP16 SDPA OK:', tuple(o.shape))"
              ])

              generator = repo / "generate.py"

              if not generator.exists():
                  raise RuntimeError("Wan generate.py bulunamadı.")

              print("8. İsteğe bağlı prompt modülü kontrolü", flush=True)

              source = generator.read_text(encoding="utf-8")

              old = (
                  "from wan.utils.prompt_extend import "
                  "DashScopePromptExpander, QwenPromptExpander"
              )

              replacement = (
                  "try:\n"
                  "    from wan.utils.prompt_extend import "
                  "DashScopePromptExpander, QwenPromptExpander\n"
                  "except ImportError:\n"
                  "    DashScopePromptExpander = None\n"
                  "    QwenPromptExpander = None"
              )

              if old in source:
                  generator.write_text(
                      source.replace(old, replacement, 1),
                      encoding="utf-8"
                  )

              print("9. Çok sahneli video üretimi", flush=True)

              generated_clips = []

              for index, scene in enumerate(scenes, start=1):
                  scene_file = output_dir / f"scene_{index:02d}.mp4"

                  final_prompt = (
                      f"{scene}. "
                      f"Story context: {topic}. "
                      f"Visual style: {style}. "
                      "Maintain visual continuity with the same story. "
                      "Cinematic composition, natural movement, "
                      "detailed environment, coherent action."
                  )

                  print(
                      f"SAHNE {index}/{len(scenes)} ÜRETİLİYOR",
                      flush=True
                  )

                  command = [
                      sys.executable,
                      str(generator),
                      "--task", "t2v-1.3B",
                      "--size", "832*480",
                      "--frame_num", "17",
                      "--ckpt_dir", model_dir,
                      "--offload_model", "True",
                      "--t5_cpu",
                      "--prompt", final_prompt,
                      "--sample_steps", "8",
                      "--sample_guide_scale", "6",
                      "--sample_shift", "8",
                      "--save_file", str(scene_file)
                  ]

                  run(command, cwd=str(repo), timeout=20000)

                  if not scene_file.exists():
                      raise RuntimeError(
                          f"Sahne {index} video dosyası oluşturmadı."
                      )

                  if scene_file.stat().st_size < 10000:
                      raise RuntimeError(
                          f"Sahne {index} video dosyası geçersiz."
                      )

                  generated_clips.append(scene_file)

                  print(
                      f"Sahne {index} tamamlandı: "
                      f"{scene_file.stat().st_size} byte",
                      flush=True
                  )

              print("10. Videolar birleştiriliyor", flush=True)

              concat_file = output_dir / "concat_list.txt"

              concat_file.write_text(
                  "".join(
                      f"file '{clip.as_posix()}'\n"
                      for clip in generated_clips
                  ),
                  encoding="utf-8"
              )

              final_video = WORK / "film.mp4"

              run([
                  "ffmpeg",
                  "-y",
                  "-f", "concat",
                  "-safe", "0",
                  "-i", str(concat_file),
                  "-c:v", "libx264",
                  "-preset", "veryfast",
                  "-crf", "20",
                  "-pix_fmt", "yuv420p",
                  "-r", "16",
                  "-movflags", "+faststart",
                  "-an",
                  str(final_video)
              ])

              if not final_video.exists():
                  raise RuntimeError("Birleştirilmiş film bulunamadı.")

              if final_video.stat().st_size < 10000:
                  raise RuntimeError("Final film dosyası geçersiz.")

              print("ÜRETİM TAMAMLANDI", flush=True)
              print("Final:", final_video, flush=True)
              print("Sahne sayısı:", len(generated_clips), flush=True)
              print("Dosya boyutu:", final_video.stat().st_size, flush=True)

          try:
              main()
          except Exception:
              traceback.print_exc()
              raise
          '''

          worker = worker.replace(
              "REQUEST_JSON = None",
              "REQUEST_JSON = " + repr(json.dumps(request, ensure_ascii=False))
          )

          Path("kaggle-worker/worker.py").write_text(
              worker,
              encoding="utf-8"
          )

          print("Sahne sayısı:", len(scenes))
          print("Worker ve metadata hazır.")
          PY

      - name: Kaggle GPU görevini başlat
        run: |
          set -euo pipefail

          kaggle kernels push \
            -p kaggle-worker \
            --timeout 21600 \
            --accelerator NvidiaTeslaT4

      - name: Kaggle görevini takip et
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          set -euo pipefail

          KERNEL="${KAGGLE_USERNAME,,}/cihan-wan-vace-worker"

          for i in $(seq 1 180); do
            STATUS=$(kaggle kernels status "$KERNEL" 2>&1 || true)
            echo "$STATUS"

            if echo "$STATUS" | grep -Eiq "COMPLETE"; then
              echo "Kaggle üretimi tamamlandı."
              exit 0
            fi

            if echo "$STATUS" | grep -Eiq "ERROR|CANCELLED"; then
              echo "Kaggle üretimi başarısız."
              kaggle kernels logs "$KERNEL" || true
              exit 1
            fi

            sleep 120
          done

          echo "Bekleme süresi doldu."
          kaggle kernels logs "$KERNEL" || true
          exit 1

      - name: Film dosyalarını indir
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          set -euo pipefail

          KERNEL="${KAGGLE_USERNAME,,}/cihan-wan-vace-worker"

          mkdir -p output

          kaggle kernels output "$KERNEL" -p output --force

          echo "İndirilen dosyalar:"
          find output -type f -print

          VIDEO=$(find output -type f -name "film.mp4" | head -n 1)

          if [ -z "$VIDEO" ]; then
            echo "Final film bulunamadı."
            kaggle kernels logs "$KERNEL" || true
            exit 1
          fi

          cp "$VIDEO" output/final-film.mp4

      - name: Film çıktısını sakla
        uses: actions/upload-artifact@v4
        with:
          name: cihan-multi-scene-film
          path: |
            output/final-film.mp4
            output/**/*.mp4
          if-no-files-found: error
          retention-days: 7
