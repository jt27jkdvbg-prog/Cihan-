
name: Wan VACE - Kaggle GPU Video

on:
  workflow_dispatch:
    inputs:
      konu:
        description: "Videonun konusu"
        required: true
        type: string
      prompt:
        description: "Sahnenin ayrıntılı açıklaması"
        required: true
        type: string
      stil:
        description: "Görsel tarz"
        required: true
        default: "cinematic realistic"
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kaggle CLI kur
        run: |
          python -m pip install --upgrade pip
          pip install kaggle six

      - name: Kaggle kimlik doğrulama
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p ~/.kaggle
          printf '%s' "$KAGGLE_API_TOKEN" > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token
          kaggle kernels list --mine

      - name: Kaggle görev dosyalarını hazırla
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          VIDEO_TOPIC: ${{ inputs.konu }}
          VIDEO_PROMPT: ${{ inputs.prompt }}
          VIDEO_STYLE: ${{ inputs.stil }}
        run: |
          mkdir -p kaggle-worker

          python - <<'PY'
          import json, os

          owner = os.environ["KAGGLE_USERNAME"].strip().lower()
          request = {
              "topic": os.environ["VIDEO_TOPIC"],
              "prompt": os.environ["VIDEO_PROMPT"],
              "style": os.environ["VIDEO_STYLE"]
          }

          metadata = {
              "id": owner + "/cihan-wan-vace-worker",
              "title": "Cihan Wan VACE Worker",
              "code_file": "worker.py",
              "language": "python",
              "kernel_type": "script",
              "is_private": True,
              "enable_gpu": True,
              "enable_internet": True,
              "machine_shape": "NvidiaTeslaT4",
              "dataset_sources": [],
              "competition_sources": [],
              "kernel_sources": [],
              "model_sources": []
          }

          with open("kaggle-worker/kernel-metadata.json", "w") as f:
              json.dump(metadata, f, indent=2)

          with open("kaggle-worker/request.json", "w") as f:
              json.dump(request, f, ensure_ascii=False, indent=2)
          PY

          cat > kaggle-worker/worker.py <<'PY'
          import os
          import sys
          import json
          import subprocess
          import traceback
          from pathlib import Path

          WORK = Path("/kaggle/working")
          OUTPUT = WORK / "output.mp4"
          REQUEST_FILE = Path(__file__).parent / "request.json"

          def run(command, cwd=None, timeout=None):
              print("\n>>>", " ".join(map(str, command)), flush=True)
              subprocess.run(
                  command,
                  cwd=cwd,
                  check=True,
                  timeout=timeout
              )

          try:
              with open(REQUEST_FILE, encoding="utf-8") as f:
                  request = json.load(f)

              topic = request["topic"]
              prompt = request["prompt"]
              style = request["style"]

              final_prompt = (
                  f"{prompt}. Subject: {topic}. "
                  f"Visual style: {style}. "
                  "Cinematic composition, coherent motion, "
                  "natural movement, detailed environment."
              )

              print("1. GPU kontrolü", flush=True)
              run([sys.executable, "-c",
                   "import torch; print(torch.cuda.is_available()); "
                   "print(torch.cuda.device_count()); "
                   "print(torch.cuda.get_device_name(0))"])

              print("2. Gerekli paketler", flush=True)
              run([
                  sys.executable, "-m", "pip", "install",
                  "ftfy==6.3.1", "easydict",
                  "imageio", "imageio-ffmpeg",
                  "opencv-python-headless",
                  "huggingface_hub"
              ])

              print("3. Wan modelini indir", flush=True)
              from huggingface_hub import snapshot_download

              model_dir = snapshot_download(
                  repo_id="Wan-AI/Wan2.1-VACE-1.3B"
              )

              print("Model klasörü:", model_dir, flush=True)

              print("4. Wan deposunu indir", flush=True)
              repo = WORK / "Wan2.1"

              if not repo.exists():
                  run([
                      "git", "clone",
                      "https://github.com/Wan-AI/Wan2.1.git",
                      str(repo)
                  ])

              generator = repo / "generate.py"

              if not generator.exists():
                  raise RuntimeError("Wan generate.py bulunamadı.")

              print("5. İsteğe bağlı prompt modülünü kontrol et", flush=True)
              source = generator.read_text(encoding="utf-8")
              old = (
                  "from wan.utils.prompt_extend import "
                  "DashScopePromptExpander, QwenPromptExpander"
              )
              replacement = (
                  "try:\n"
                  "    from wan.utils.prompt_extend import "
                  "DashScopePromptExpander, QwenPromptExpander\n"
                  "except ImportError:\n"
                  "    DashScopePromptExpander = None\n"
                  "    QwenPromptExpander = None"
              )

              if old in source:
                  generator.write_text(
                      source.replace(old, replacement),
                      encoding="utf-8"
                  )

              print("6. VACE video üretimi başlıyor", flush=True)

              command = [
                  sys.executable,
                  str(generator),
                  "--task", "vace-1.3B",
                  "--size", "480*832",
                  "--frame_num", "17",
                  "--ckpt_dir", model_dir,
                  "--offload_model", "True",
                  "--t5_cpu",
                  "--prompt", final_prompt,
                  "--sample_steps", "8",
                  "--sample_guide_scale", "5",
                  "--save_file", str(OUTPUT)
              ]

              run(command, cwd=str(repo), timeout=20000)

              if not OUTPUT.exists() or OUTPUT.stat().st_size < 10000:
                  raise RuntimeError("Video oluşmadı veya dosya boş.")

              print("BAŞARILI:", OUTPUT, flush=True)
              print("Boyut:", OUTPUT.stat().st_size, "byte", flush=True)

          except Exception:
              traceback.print_exc()
              raise
          PY

      - name: Kaggle GPU görevini başlat
        run: |
          kaggle kernels push \
            -p kaggle-worker \
            --timeout 21600 \
            --accelerator NvidiaTeslaT4

      - name: Kaggle görevini takip et
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          KERNEL="${KAGGLE_USERNAME,,}/cihan-wan-vace-worker"
          for i in $(seq 1 180); do
            STATUS=$(kaggle kernels status "$KERNEL" 2>&1 || true)
            echo "$STATUS"

            if echo "$STATUS" | grep -q "COMPLETE"; then
              exit 0
            fi

            if echo "$STATUS" | grep -q "ERROR"; then
              echo "Kaggle üretim görevi hata verdi."
              kaggle kernels logs "$KERNEL" || true
              exit 1
            fi

            sleep 120
          done

          echo "Bekleme süresi doldu."
          kaggle kernels logs "$KERNEL" || true
          exit 1

      - name: MP4 dosyasını Kaggle'dan al
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          KERNEL="${KAGGLE_USERNAME,,}/cihan-wan-vace-worker"
          mkdir -p output
          kaggle kernels output "$KERNEL" -p output --force
          find output -maxdepth 2 -type f -print

          VIDEO=$(find output -type f -name "*.mp4" | head -n 1)
          if [ -z "$VIDEO" ]; then
            echo "Kaggle çıktısında MP4 bulunamadı."
            exit 1
          fi

          cp "$VIDEO" output/video.mp4

      - name: Videoyu GitHub'a yükle
        uses: actions/upload-artifact@v4
        with:
          name: wan-vace-video
          path: output/video.mp4
          retention-days: 7
