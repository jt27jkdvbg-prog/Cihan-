
name: Wan Multi-Scene Film Generator

on:
  workflow_dispatch:
    inputs:
      project_json:
        description: "Standart film projesi JSON (öncelikli yöntem)"
        required: false
        type: string
      konu:
        description: "Filmin konusu (eski yöntem)"
        required: false
        type: string
      prompt:
        description: "Ana hikaye ve karakter açıklaması (eski yöntem)"
        required: false
        type: string
      scenes_json:
        description: "Sahne açıklamalarının JSON listesi (eski yöntem)"
        required: false
        type: string
      stil:
        description: "Görsel tarz"
        required: false
        default: "cinematic realistic"
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kaggle CLI kur
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install --upgrade kaggle six

      - name: Kaggle kimlik doğrulama
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "KAGGLE_API_TOKEN eksik."
            exit 1
          fi

          mkdir -p ~/.kaggle
          printf '%s' "$KAGGLE_API_TOKEN" > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token

          kaggle kernels list --mine

      - name: Film projesini doğrula ve Worker hazırla
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          VIDEO_PROJECT_JSON: ${{ inputs.project_json }}
          VIDEO_TOPIC: ${{ inputs.konu }}
          VIDEO_PROMPT: ${{ inputs.prompt }}
          VIDEO_SCENES_JSON: ${{ inputs.scenes_json }}
          VIDEO_STYLE: ${{ inputs.stil }}
        run: |
          set -euo pipefail
          mkdir -p kaggle-worker

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from film_project import validate_film_project

          owner = os.environ["KAGGLE_USERNAME"].strip().lower()
          raw_project = os.environ.get("VIDEO_PROJECT_JSON", "").strip()
          topic_input = os.environ.get("VIDEO_TOPIC", "").strip()
          prompt_input = os.environ.get("VIDEO_PROMPT", "").strip()
          style_input = os.environ.get("VIDEO_STYLE", "").strip() or "cinematic realistic"
          raw_scenes = os.environ.get("VIDEO_SCENES_JSON", "").strip()

          if not owner:
              raise ValueError("KAGGLE_USERNAME boş olamaz.")

          if raw_project:
              print("Standart film projesi bulundu. JSON doğrulanıyor...")

              try:
                  project = json.loads(raw_project)
              except json.JSONDecodeError as exc:
                  raise ValueError(
                      f"project_json geçerli JSON değil: {exc}"
                  ) from exc

              report = validate_film_project(project)

              if not report["valid"]:
                  details = "\n".join(
                      "- " + error for error in report["errors"]
                  )
                  raise ValueError(
                      "Film projesi doğrulamadan geçemedi:\n" + details
                  )

              film = project["film"]
              characters = project["characters"]

              topic = (
                  str(film.get("topic") or "").strip()
                  or str(film.get("title") or "").strip()
              )

              prompt_parts = [
                  str(film.get("description") or "").strip(),
                  str(film.get("character_bible") or "").strip(),
              ]

              prompt = " ".join(part for part in prompt_parts if part).strip()

              if not prompt:
                  prompt = str(film.get("title") or "Short film").strip()

              style = (
                  str(film.get("visual_style") or "").strip()
                  or style_input
              )

              character_descriptions = []

              for character in characters:
                  description = (
                      f"{character['name']}: "
                      f"{character.get('description', '')}. "
                      f"Personality: {character.get('personality', '')}."
                  ).strip()

                  character_descriptions.append(description)

              character_bible = " ".join(character_descriptions)

              scenes = []

              for index, scene in enumerate(project["scenes"], 1):
                  parts = []

                  if scene.get("visual_subject"):
                      parts.append(
                          "Visual subject: " + scene["visual_subject"]
                      )

                  if scene.get("location"):
                      parts.append("Location: " + scene["location"])

                  if scene.get("action"):
                      parts.append("Action: " + scene["action"])

                  if scene.get("props"):
                      parts.append("Props: " + scene["props"])

                  if scene.get("image_prompt"):
                      parts.append(
                          "Visual description: " + scene["image_prompt"]
                      )

                  if scene.get("motion_prompt"):
                      parts.append(
                          "Movement direction: " + scene["motion_prompt"]
                      )

                  if scene.get("camera"):
                      parts.append("Camera: " + scene["camera"])

                  if scene.get("narration"):
                      parts.append(
                          "Narrative context: " + scene["narration"]
                      )

                  dialogue_lines = []

                  for turn in scene.get("dialogue_turns", []):
                      speaker_id = turn.get("speaker", "")
                      speaker = next(
                          (
                              character["name"]
                              for character in characters
                              if character["id"] == speaker_id
                          ),
                          speaker_id
                      )

                      dialogue_lines.append(
                          f"{speaker} says: {turn['text']}"
                      )

                  if dialogue_lines:
                      parts.append(
                          "Dialogue context, not subtitles: "
                          + " ".join(dialogue_lines)
                      )

                  if scene.get("sound"):
                      parts.append(
                          "Intended sound atmosphere: " + scene["sound"]
                      )

                  if scene.get("transition"):
                      parts.append(
                          "Transition context: " + scene["transition"]
                      )

                  scene_prompt = ". ".join(
                      part for part in parts if part
                  ).strip()

                  if not scene_prompt:
                      raise ValueError(
                          f"{index}. sahnenin üretim açıklaması boş."
                      )

                  scenes.append(scene_prompt)

              print("Standart proje doğrulandı.")
              print("Film:", film.get("title"))
              print("Karakter:", len(characters))
              print("Sahne:", len(scenes))
              print("Hedef süre:", film.get("target_duration_seconds"), "sn")

          else:
              print("Eski giriş yöntemi kullanılıyor.")

              if not topic_input or not prompt_input:
                  raise ValueError(
                      "project_json kullanmıyorsanız konu ve prompt zorunludur."
                  )

              topic = topic_input
              prompt = prompt_input
              style = style_input

              scenes = json.loads(raw_scenes) if raw_scenes else [prompt]

              if not isinstance(scenes, list) or not scenes:
                  raise ValueError(
                      "Sahneler JSON listesi olmalıdır."
                  )

              if len(scenes) > 15:
                  raise ValueError(
                      "En fazla 15 sahne üretilebilir."
                  )

              if not all(
                  isinstance(scene, str) and scene.strip()
                  for scene in scenes
              ):
                  raise ValueError(
                      "Her sahne dolu bir metin olmalıdır."
                  )

              character_bible = ""

          if not 1 <= len(scenes) <= 15:
              raise ValueError(
                  "Sahne sayısı 1 ile 15 arasında olmalıdır."
              )

          if not topic or not prompt or not style:
              raise ValueError(
                  "Konu, ana prompt ve görsel stil boş olamaz."
              )

          request = {
              "topic": topic,
              "prompt": prompt,
              "style": style,
              "character_bible": character_bible,
              "scenes": scenes
          }

          metadata = {
              "id": owner + "/cihan-multi-scene-film-worker",
              "title": "Cihan Multi Scene Film Worker",
              "code_file": "worker.py",
              "language": "python",
              "kernel_type": "script",
              "is_private": True,
              "enable_gpu": True,
              "enable_internet": True,
              "machine_shape": "NvidiaTeslaT4",
              "dataset_sources": [],
              "competition_sources": [],
              "kernel_sources": [],
              "model_sources": []
          }

          Path("kaggle-worker/kernel-metadata.json").write_text(
              json.dumps(metadata, indent=2),
              encoding="utf-8"
          )

          worker = r'''
          import sys
          import json
          import shutil
          import subprocess
          import traceback
          from pathlib import Path

          WORK = Path("/kaggle/working")
          WAN_REPO_COMMIT = "9737cba9c1c3c4d04b33fcad41c111989865d315"
          REQUEST_JSON = None

          def run(command, cwd=None, timeout=None):
              print("\\n>>>", " ".join(map(str, command)), flush=True)
              subprocess.run(
                  command,
                  cwd=cwd,
                  check=True,
                  timeout=timeout
              )

          def main():
              request = json.loads(REQUEST_JSON)
              topic = request["topic"]
              style = request["style"]
              scenes = request["scenes"]
              character_bible = request.get("character_bible", "")

              output_dir = WORK / "film_output"
              output_dir.mkdir(parents=True, exist_ok=True)

              print("1. GPU kontrolü", flush=True)

              run([
                  sys.executable, "-c",
                  "import torch; "
                  "assert torch.cuda.is_available(), 'CUDA bulunamadı'; "
                  "print(torch.cuda.get_device_name(0))"
              ])

              print("2. Wan bağımlılıkları kuruluyor", flush=True)

              run([
                  sys.executable, "-m", "pip", "install",
                  "ftfy==6.3.1",
                  "easydict",
                  "einops",
                  "timm",
                  "safetensors",
                  "diffusers>=0.31.0",
                  "transformers>=4.49.0",
                  "tokenizers>=0.20.3",
                  "accelerate>=1.1.1",
                  "tqdm",
                  "numpy>=1.23.5,<2",
                  "imageio",
                  "imageio-ffmpeg",
                  "opencv-python-headless",
                  "huggingface_hub"
              ], timeout=3600)

              print("3. FFmpeg kontrolü", flush=True)

              if not shutil.which("ffmpeg"):
                  run(["apt-get", "update"], timeout=1200)
                  run(["apt-get", "install", "-y", "ffmpeg"], timeout=1200)

              print("4. Wan modeli indiriliyor", flush=True)

              from huggingface_hub import snapshot_download

              model_dir = snapshot_download(
                  repo_id="Wan-AI/Wan2.1-T2V-1.3B"
              )

              print("Model hazır:", model_dir, flush=True)

              print("5. Wan deposu hazırlanıyor", flush=True)

              repo = WORK / "Wan2.1"

              if not repo.exists():
                  run(["git", "init", str(repo)])
                  run([
                      "git", "-C", str(repo),
                      "remote", "add", "origin",
                      "https://github.com/Wan-Video/Wan2.1.git"
                  ])
                  run([
                      "git", "-C", str(repo),
                      "fetch", "--depth", "1",
                      "origin", WAN_REPO_COMMIT
                  ], timeout=1800)
                  run([
                      "git", "-C", str(repo),
                      "checkout", "--detach", "FETCH_HEAD"
                  ])

              print("6. T4 FP16 uyumluluğu ayarlanıyor", flush=True)

              model_file = repo / "wan" / "modules" / "model.py"
              model_source = model_file.read_text(encoding="utf-8")

              old_import = "from .attention import flash_attention"

              if old_import not in model_source:
                  raise RuntimeError(
                      "Attention import satırı bulunamadı."
                  )

              model_source = model_source.replace(
                  old_import,
                  "from .attention import attention",
                  1
              )

              if "flash_attention(" not in model_source:
                  raise RuntimeError(
                      "Attention çağrıları bulunamadı."
                  )

              model_source = model_source.replace(
                  "flash_attention(",
                  "attention("
              )

              if "flash_attention(" in model_source:
                  raise RuntimeError(
                      "Attention dönüşümü tamamlanamadı."
                  )

              model_file.write_text(
                  model_source,
                  encoding="utf-8"
              )

              attention_file = repo / "wan" / "modules" / "attention.py"
              attention_source = attention_file.read_text(
                  encoding="utf-8"
              )

              old_dtype = "dtype=torch.bfloat16,"

              if old_dtype not in attention_source:
                  raise RuntimeError(
                      "Attention BF16 ayarı bulunamadı."
                  )

              attention_source = attention_source.replace(
                  old_dtype,
                  "dtype=torch.float16,"
              )

              if old_dtype in attention_source:
                  raise RuntimeError(
                      "Tüm BF16 ayarları FP16 yapılamadı."
                  )

              attention_file.write_text(
                  attention_source,
                  encoding="utf-8"
              )

              shared_file = repo / "wan" / "configs" / "shared_config.py"
              shared_source = shared_file.read_text(
                  encoding="utf-8"
              )

              replacements = [
                  (
                      "wan_shared_cfg.t5_dtype = torch.bfloat16",
                      "wan_shared_cfg.t5_dtype = torch.float16"
                  ),
                  (
                      "wan_shared_cfg.param_dtype = torch.bfloat16",
                      "wan_shared_cfg.param_dtype = torch.float16"
                  )
              ]

              for old, new in replacements:
                  if old not in shared_source:
                      raise RuntimeError(
                          "FP16 yapılandırma satırı bulunamadı: " + old
                      )

                  shared_source = shared_source.replace(
                      old,
                      new,
                      1
                  )

              shared_file.write_text(
                  shared_source,
                  encoding="utf-8"
              )

              print("7. FP16 GPU testi", flush=True)

              run([
                  sys.executable, "-c",
                  "import torch; "
                  "q=torch.randn((1,2,128,64),device='cuda',dtype=torch.float16); "
                  "o=torch.nn.functional.scaled_dot_product_attention(q,q,q); "
                  "torch.cuda.synchronize(); "
                  "print('FP16 SDPA OK:', tuple(o.shape))"
              ])

              generator = repo / "generate.py"

              if not generator.exists():
                  raise RuntimeError(
                      "Wan generate.py bulunamadı."
                  )

              print("8. İsteğe bağlı prompt modülü kontrolü", flush=True)

              source = generator.read_text(encoding="utf-8")

              old = (
                  "from wan.utils.prompt_extend import "
                  "DashScopePromptExpander, QwenPromptExpander"
              )

              replacement = (
                  "try:\n"
                  "    from wan.utils.prompt_extend import "
                  "DashScopePromptExpander, QwenPromptExpander\n"
                  "except ImportError:\n"
                  "    DashScopePromptExpander = None\n"
                  "    QwenPromptExpander = None"
              )

              if old in source:
                  generator.write_text(
                      source.replace(old, replacement, 1),
                      encoding="utf-8"
                  )

              print("9. Çok sahneli video üretimi", flush=True)

              import gc
              import time
              import torch

              sys.path.insert(0, str(repo))
              import wan
              from wan.configs import WAN_CONFIGS, SIZE_CONFIGS
              from wan.utils.utils import cache_video

              cfg = WAN_CONFIGS["t2v-1.3B"]

              print(
                  "Wan modeli bir kez yükleniyor...",
                  flush=True
              )

              pipeline = wan.WanT2V(
                  config=cfg,
                  checkpoint_dir=model_dir,
                  device_id=0,
                  rank=0,
                  t5_fsdp=False,
                  dit_fsdp=False,
                  use_usp=False,
                  t5_cpu=True,
              )

              print("Wan modeli hazır.", flush=True)

              generated_clips = []

              for index, scene in enumerate(scenes, start=1):
                  scene_started = time.perf_counter()
                  scene_file = output_dir / f"scene_{index:02d}.mp4"

                  final_prompt = (
                      f"{scene}. "
                      f"Story context: {topic}. "
                      f"Character continuity reference: "
                      f"{character_bible}. "
                      f"Visual style: {style}. "
                      "Maintain the same character appearance, "
                      "clothing, facial features and environment "
                      "throughout this story. "
                      "Cinematic composition, natural body movement, "
                      "coherent physical action, detailed environment, "
                      "professional film lighting."
                  )

                  print(
                      f"SAHNE {index}/{len(scenes)} ÜRETİLİYOR "
                      "(81 kare / yaklaşık 5 saniye)",
                      flush=True
                  )

                  video = pipeline.generate(
                      input_prompt=final_prompt,
                      size=SIZE_CONFIGS["832*480"],
                      frame_num=81,
                      shift=8,
                      sample_solver="unipc",
                      sampling_steps=8,
                      guide_scale=6,
                      seed=-1,
                      offload_model=True,
                  )

                  torch.cuda.synchronize()

                  cache_video(
                      tensor=video[None],
                      save_file=str(scene_file),
                      fps=cfg.sample_fps,
                      nrow=1,
                      normalize=True,
                      value_range=(-1, 1),
                  )

                  del video
                  gc.collect()
                  torch.cuda.empty_cache()

                  if not scene_file.exists():
                      raise RuntimeError(
                          f"Sahne {index} video dosyası oluşturmadı."
                      )

                  if scene_file.stat().st_size < 10000:
                      raise RuntimeError(
                          f"Sahne {index} video dosyası geçersiz."
                      )

                  generated_clips.append(scene_file)

                  print(
                      f"Sahne {index} tamamlandı | "
                      f"{scene_file.stat().st_size} byte | "
                      f"{time.perf_counter() - scene_started:.1f} saniye",
                      flush=True
                  )

              print("10. Videolar birleştiriliyor", flush=True)

              concat_file = output_dir / "concat_list.txt"

              concat_file.write_text(
                  "".join(
                      f"file '{clip.as_posix()}'\n"
                      for clip in generated_clips
                  ),
                  encoding="utf-8"
              )

              final_video = WORK / "film.mp4"

              run([
                  "ffmpeg",
                  "-y",
                  "-f", "concat",
                  "-safe", "0",
                  "-i", str(concat_file),
                  "-c:v", "libx264",
                  "-preset", "veryfast",
                  "-crf", "20",
                  "-pix_fmt", "yuv420p",
                  "-r", "16",
                  "-movflags", "+faststart",
                  "-an",
                  str(final_video)
              ])

              if not final_video.exists():
                  raise RuntimeError(
                      "Birleştirilmiş film bulunamadı."
                  )

              if final_video.stat().st_size < 10000:
                  raise RuntimeError(
                      "Final film dosyası geçersiz."
                  )

              print("ÜRETİM TAMAMLANDI", flush=True)
              print("Final:", final_video, flush=True)
              print("Sahne sayısı:", len(generated_clips), flush=True)
              print("Dosya boyutu:", final_video.stat().st_size, flush=True)

          try:
              main()
          except Exception:
              traceback.print_exc()
              raise
                    '''

          worker = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in worker.splitlines()
          ) + "\n"

          worker = worker.replace(
              "REQUEST_JSON = None",
              "REQUEST_JSON = " + repr(
                  json.dumps(request, ensure_ascii=False)
              )
          )

          Path("kaggle-worker/worker.py").write_text(
              worker,
              encoding="utf-8"
          )

          print("Sahne sayısı:", len(scenes))
          print("Worker ve metadata hazır.")
          PY

      - name: Worker ve Kaggle metadata ön kontrolü
        run: |
          set -euo pipefail

          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          worker_path = Path("kaggle-worker/worker.py")
          metadata_path = Path("kaggle-worker/kernel-metadata.json")

          if not worker_path.is_file():
              raise SystemExit("Worker dosyası oluşturulmadı.")

          if not metadata_path.is_file():
              raise SystemExit("Kaggle metadata dosyası oluşturulmadı.")

          source = worker_path.read_text(encoding="utf-8")
          tree = ast.parse(source, filename=str(worker_path))

          request_value = None

          for node in ast.walk(tree):
              if not isinstance(node, ast.Assign):
                  continue

              if any(
                  isinstance(target, ast.Name)
                  and target.id == "REQUEST_JSON"
                  for target in node.targets
              ):
                  request_value = ast.literal_eval(node.value)
                  break

          if not isinstance(request_value, str):
              raise SystemExit("Worker içine film isteği gömülmemiş.")

          request = json.loads(request_value)
          metadata = json.loads(
              metadata_path.read_text(encoding="utf-8")
          )

          required_request_fields = {
              "topic", "prompt", "style", "character_bible", "scenes"
          }

          missing = required_request_fields - set(request)
          if missing:
              raise SystemExit(
                  "Film isteğinde eksik alanlar: "
                  + ", ".join(sorted(missing))
              )

          scenes = request["scenes"]
          if (
              not isinstance(scenes, list)
              or not 1 <= len(scenes) <= 15
              or not all(
                  isinstance(scene, str) and scene.strip()
                  for scene in scenes
              )
          ):
              raise SystemExit("Worker sahne listesi geçersiz.")

          if metadata.get("code_file") != "worker.py":
              raise SystemExit("Kaggle code_file worker.py olmalıdır.")

          if metadata.get("kernel_type") != "script":
              raise SystemExit("Kaggle kernel_type script olmalıdır.")

          if metadata.get("enable_gpu") is not True:
              raise SystemExit("Kaggle GPU etkin değil.")

          if metadata.get("machine_shape") != "NvidiaTeslaT4":
              raise SystemExit("Beklenmeyen Kaggle GPU türü.")

          compile(source, str(worker_path), "exec")

          print("Worker Python sözdizimi: OK")
          print("Film isteği JSON: OK")
          print("Kaggle metadata: OK")
          print("Doğrulanan sahne sayısı:", len(scenes))
          print("GPU profili:", metadata["machine_shape"])
          PY

      - name: Wan kaynak kodu uyumluluk ön kontrolü
        run: |
          set -euo pipefail

          WAN_REPO_COMMIT="9737cba9c1c3c4d04b33fcad41c111989865d315"
          git init /tmp/Wan2.1
          git -C /tmp/Wan2.1 remote add origin https://github.com/Wan-Video/Wan2.1.git
          git -C /tmp/Wan2.1 fetch --depth 1 origin "$WAN_REPO_COMMIT"
          git -C /tmp/Wan2.1 checkout --detach FETCH_HEAD
          test "$(git -C /tmp/Wan2.1 rev-parse HEAD)" = "$WAN_REPO_COMMIT"

          python - <<'PY'
          import ast
          from pathlib import Path

          repo = Path("/tmp/Wan2.1")

          model_path = repo / "wan/modules/model.py"
          attention_path = repo / "wan/modules/attention.py"
          shared_path = repo / "wan/configs/shared_config.py"
          text2video_path = repo / "wan/text2video.py"
          config_path = repo / "wan/configs/__init__.py"

          model_source = model_path.read_text(encoding="utf-8")
          attention_source = attention_path.read_text(encoding="utf-8")
          shared_source = shared_path.read_text(encoding="utf-8")
          config_source = config_path.read_text(encoding="utf-8")

          required_fragments = {
              "Wan model attention import":
                  "from .attention import flash_attention",
              "Wan model attention calls":
                  "flash_attention(",
              "SDPA-compatible attention function":
                  "def attention(",
              "FP16 conversion target":
                  "dtype=torch.bfloat16,",
              "T5 dtype setting":
                  "wan_shared_cfg.t5_dtype = torch.bfloat16",
              "DiT dtype setting":
                  "wan_shared_cfg.param_dtype = torch.bfloat16",
              "832x480 size preset":
                  "'832*480': (832, 480)",
              "1.3B text-to-video config":
                  "'t2v-1.3B': t2v_1_3B",
          }

          sources = {
              "Wan model attention import": model_source,
              "Wan model attention calls": model_source,
              "SDPA-compatible attention function": attention_source,
              "FP16 conversion target": attention_source,
              "T5 dtype setting": shared_source,
              "DiT dtype setting": shared_source,
              "832x480 size preset": config_source,
              "1.3B text-to-video config": config_source,
          }

          for label, fragment in required_fragments.items():
              if fragment not in sources[label]:
                  raise SystemExit(
                      "Wan kaynak kodu uyumsuz: " + label
                  )

          text2video_tree = ast.parse(
              text2video_path.read_text(encoding="utf-8"),
              filename=str(text2video_path)
          )

          wan_t2v = next(
              node for node in text2video_tree.body
              if isinstance(node, ast.ClassDef) and node.name == "WanT2V"
          )

          methods = {
              node.name: node
              for node in wan_t2v.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }

          if not {"__init__", "generate"}.issubset(methods):
              raise SystemExit("WanT2V constructor/generate API bulunamadı.")

          def argument_names(function):
              return {
                  argument.arg
                  for argument in (
                      function.args.posonlyargs + function.args.args
                      + function.args.kwonlyargs
                  )
              }

          constructor_required = {
              "config", "checkpoint_dir", "device_id", "rank",
              "t5_fsdp", "dit_fsdp", "use_usp", "t5_cpu"
          }

          generate_required = {
              "input_prompt", "size", "frame_num", "shift",
              "sample_solver", "sampling_steps", "guide_scale",
              "seed", "offload_model"
          }

          if not constructor_required.issubset(
              argument_names(methods["__init__"])
          ):
              raise SystemExit("WanT2V constructor parametreleri değişmiş.")

          if not generate_required.issubset(
              argument_names(methods["generate"])
          ):
              raise SystemExit("WanT2V generate parametreleri değişmiş.")

          print("Wan attention yama noktaları: OK")
          print("Wan FP16 yapılandırma noktaları: OK")
          print("Wan 832x480 / T2V 1.3B profili: OK")
          print("WanT2V Python API: OK")
          PY

      - name: Kaggle GPU görevini başlat
        run: |
          set -euo pipefail

          kaggle kernels push \
            -p kaggle-worker \
            --timeout 21600 \
            --accelerator NvidiaTeslaT4

      - name: Kaggle görevini takip et
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          set -euo pipefail

          KERNEL="${KAGGLE_USERNAME,,}/cihan-multi-scene-film-worker"

          # 165 x 120 saniye = 5 saat 30 dakika.
          # GitHub Actions'ın 6 saatlik iş sınırına pay bırakılır.
          for i in $(seq 1 165); do
            STATUS=$(kaggle kernels status "$KERNEL" 2>&1 || true)
            STATUS_UPPER=$(printf '%s' "$STATUS" | tr '[:lower:]' '[:upper:]')
            echo "Kontrol $i/165"
            echo "$STATUS"

            # INCOMPLETE kelimesinin yanlışlıkla COMPLETE sayılmasını önle.
            if printf '%s' "$STATUS_UPPER" | grep -Eq '(^|[^A-Z])COMPLETE([^A-Z]|$)'; then
              echo "Kaggle üretimi tamamlandı."
              exit 0
            fi

            if printf '%s' "$STATUS_UPPER" | grep -Eq '(^|[^A-Z])(ERROR|CANCELLED)([^A-Z]|$)'; then
              echo "Kaggle üretimi başarısız."
              kaggle kernels logs "$KERNEL" || true
              exit 1
            fi

            sleep 120
          done

          echo "Bekleme süresi doldu."
          kaggle kernels logs "$KERNEL" || true
          exit 1

      - name: Film dosyalarını indir
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          set -euo pipefail

          KERNEL="${KAGGLE_USERNAME,,}/cihan-multi-scene-film-worker"

          mkdir -p output

          kaggle kernels output "$KERNEL" -p output --force

          echo "İndirilen dosyalar:"
          find output -type f -print

          VIDEO=$(find output -type f -name "film.mp4" | head -n 1)

          if [ -z "$VIDEO" ]; then
            echo "Final film bulunamadı."
            kaggle kernels logs "$KERNEL" || true
            exit 1
          fi

          cp "$VIDEO" output/final-film.mp4

      - name: Film çıktısını sakla
        uses: actions/upload-artifact@v4
        with:
          name: cihan-multi-scene-film
          path: |
            output/final-film.mp4
            output/**/*.mp4
          if-no-files-found: error
          retention-days: 7

